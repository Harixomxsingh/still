name: Build & Release Standalone Android APK

on:
  push:
    branches: ["main"]
    paths:
      - 'v2/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: v2/mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: |
          cd v2/mobile
          npm install

      - name: Generate Native Android Project
        run: |
          cd v2/mobile
          npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK (Gradle)
        run: |
          cd v2/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Package Still.apk
        run: |
          APK_PATH=$(find v2/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found compiled APK at: $APK_PATH"
          cp "$APK_PATH" Still.apk
          cp "$APK_PATH" v2/web/public/Still.apk
          ls -lh Still.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Still-Android-APK
          path: Still.apk

      - name: Commit and Push Compiled APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Still.apk v2/web/public/Still.apk
          git commit -m "build(android): compile real Standalone Still.apk [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: "Still v2.0.0 — Standalone Android Release"
          body: |
            ## 📱 Still for Android (v2.0.0)
            
            A distraction-free, neuro-acoustic sanctuary for your pocket.
            
            ### ✨ Features in this release:
            - **🔒 Background Audio & MediaSession:** Keeps playing when screen locks.
            - **🫁 0.1 Hz Resonant Breathing with Haptics:** Tactile phone vibration breathing guide.
            - **🎛️ Physical Tactile Stem Mixer:** Sliders with continuous vibration feedback.
            - **🎨 4 Mood Themes:** Midnight Obsidian, Sunrise Amber, Forest Biophilic, Lavender Dusk.
            - **🌿 Purpose-Driven Library:** 7 research-backed soundscapes.
            
            ### 📥 Installation:
            1. Download `Still.apk` below.
            2. Tap the notification to open and install.
          files: Still.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
