name: Build & Release Standalone Android APK

on:
  push:
    branches: ["main"]
    paths:
      - 'v2/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "Using Android SDK at: $ANDROID_HOME"

      - name: Install Dependencies & Run Universal Test Gate
        run: |
          cd v2/web
          npm install
          npm test
          npm run build
          cd ../..
          node scripts/bundle_mobile_html.js
          cd v2/mobile
          npm install
          npm test
          cd ../..
          node scripts/verify_bundle.js

      - name: Build Standalone Release APK (Gradle)
        run: |
          cd v2/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Copy & Package Still.apk
        run: |
          APK_PATH=$(find v2/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find v2/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found compiled Release APK at: $APK_PATH"
          cp "$APK_PATH" Still.apk
          cp "$APK_PATH" v2/web/public/Still.apk
          ls -lh Still.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Still-Android-APK
          path: Still.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.0
          name: "Still v2.2.0 — Standalone Android Release"
          body: |
            ## 📱 Still for Android (v2.2.0)
            
            A distraction-free, neuro-acoustic sanctuary for your pocket.
            
            ### ✨ Features in this release:
            - **🎧 7 Authentic High-Fidelity 20m Soundscapes:** Procedurally synthesized warm Solfeggio pads, 0.1 Hz breathing resonance filter, oceanic Brownian rumble, and stochastic pentatonic piano droplets.
            - **🔒 Background Audio & MediaSession:** 3 permanent notification controls (Previous, Play/Pause, Next) with 0ms response.
            - **⏱️ 20-Minute Daily Stillness Streak:** Live progress tracking directly in the notification shade.
            - **🫁 0.1 Hz Resonant Breathing with Haptics:** Tactile phone vibration breathing guide.
            - **🎨 4 Mood Themes:** Midnight Obsidian, Sunrise Amber, Forest Biophilic, Lavender Dusk.
            
            ### 📥 Installation:
            1. Download `Still.apk` below.
            2. Tap the notification on your Android device to install.
          files: Still.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
